name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff flake8 mypy
      - name: Lint
        run: |
          ruff check identity_generator tests tools
          flake8 identity_generator tests tools --max-line-length=200 --extend-ignore=E501
          mypy identity_generator
      - name: Run test suite
        run: python -m pytest tests/ -q --cov=identity_generator --cov-report=term-missing --cov-fail-under=70

  secrets:
    # I scan the whole git history plus every push for leaked API keys, because
    # the real email_keys.json and domains.json live only on user machines and
    # one accidental commit would expose the tokens they hold.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Install the wheel in a clean venv
        run: |
          python -m venv wheelcheck
          wheelcheck/bin/pip install --quiet dist/identity_generator-*.whl
      - name: Smoke test the installed console script
        run: |
          wheelcheck/bin/identity-generator --list-locales
          wheelcheck/bin/identity-generator --locale de_DE --seed 42 --email-offline --json
          wheelcheck/bin/python -c "import glob, json; path = glob.glob('*_identity.json')[0]; data = json.load(open(path, encoding='utf-8')); assert data['city'] == 'Berlin', data; assert data['national_id']; print('wheel smoke OK, datasets shipped:', data['address'])"